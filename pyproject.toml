[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai"
version = "0.1.0"
description = "SentinelAI - an autonomous, injection-hardened AI SOC analyst (defensive use only)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "chromadb>=0.5",
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "fonttools>=4.40",
    "fpdf2>=2.8",
    "httpx>=0.27",
    "mlflow>=2.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5",
    "sentence-transformers>=3",
    "streamlit>=1.38",
    "torch>=2.3",
    "uvicorn>=0.30",
]

[project.scripts]
sentinel-data = "data.cli:main"
sentinel-detect = "detection.train:main"
sentinel-kb = "rag.cli:main"
sentinel-eval = "eval.harness:main"

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[dependency-groups]
demo = [
    "playwright>=1.45",
]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pypdf>=5",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = [
    "common*", "data*", "detection*", "rag*", "agent*",
    "guardrails*", "eval*", "api*", "ui*",
]

[tool.setuptools.package-data]
agent = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: test needs internet access (deselected by default)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PT", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^build/"]

[[tool.mypy.overrides]]
module = [
    "defusedxml.*", "pyarrow.*", "sklearn.*", "joblib.*", "mlflow.*", "rank_bm25.*", "sentence_transformers.*",
    "fontTools.*", "playwright.*",
]
ignore_missing_imports = true

# On Linux (Docker, CI) use CPU-only PyTorch wheels: the default wheels bundle
# several GB of CUDA libraries this project never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
