# docker compose up --build
#   API        http://localhost:8000/docs
#   Dashboard  http://localhost:8501
services:
  api:
    build: .
    image: sentinelai:latest
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # The dashboard runs investigations in-process; it does not call the API.
  ui:
    build: .
    image: sentinelai:latest
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - path: .env
        required: false
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
